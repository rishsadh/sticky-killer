<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>transform-ancestors</title><style>
body{margin:0;font:16px sans-serif}
.hdr{position:sticky;top:0;height:56px;background:#222;color:#fff}
.fill{height:2400px;background:linear-gradient(#eee,#ccc)}
.a{transform:translateZ(0);filter:blur(0)}.b{contain:paint}.c{will-change:transform;perspective:400px}
</style></head><body>
<div class="a"><div class="b"><div class="c"><header class="hdr">Header</header><div class="fill"></div></div></div></div>
</body></html>
