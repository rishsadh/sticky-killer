<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>horizontal-sticky</title><style>
body{margin:0;font:16px sans-serif}
.hdr{position:sticky;top:0;height:56px;background:#222;color:#fff}
.fill{height:2400px;background:linear-gradient(#eee,#ccc)}
.wrap{overflow-x:hidden}.row{display:flex;width:3000px}.col{position:sticky;left:0;width:120px;background:#c60}.cells{flex:1;height:60px;background:#ddd}
</style></head><body>
<div class="wrap"><div class="row"><div class="col">Name</div><div class="cells"></div></div></div>
</body></html>
